name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'babel.config.js'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/import-build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify production JS bundle
        env:
          CI: '1'
        run: npx expo export --platform android --output-dir dist-smoke

      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build self-contained release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk Lark-Media-Player.apk
          test -s Lark-Media-Player.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lark-Media-Player-Release-APK
          path: Lark-Media-Player.apk
          if-no-files-found: error
          retention-days: 30
